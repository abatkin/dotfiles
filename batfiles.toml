# Batfiles manifest for these dotfiles.
#
# This is the whole installation. It replaces install.sh and the numbered
# installers under install/, which are gone; see README.md for how to run it.
#
# Actions run in declaration order, and the order below is the order the
# numbered installers ran in, which is also the order correctness requires:
# oh-my-zsh is cloned before anything installs into it.

# --- 10-download-oh-my-zsh.sh ---------------------------------------------
# Has to come first. Every action creates the parents of what it installs, so
# a symlink-dir into ~/.oh-my-zsh/custom would create ~/.oh-my-zsh as a plain
# directory, and a plain directory is a destination git-clone refuses by name.
#
# The URL is the one the existing clones were made with. Batfiles never
# compares it against a clone's configured remote, so it is written the way
# the script wrote it rather than as the address that redirects today.

[[actions]]
type = "git-clone"
id = "oh-my-zsh"
group = "oh-my-zsh"
source = "https://github.com/robbyrussell/oh-my-zsh.git"
dest = "~/.oh-my-zsh"

# --- 15-setup-oh-my-zsh.sh ------------------------------------------------

[[actions]]
type = "symlink-dir"
id = "omz-custom"
group = "oh-my-zsh"
source-dir = "oh-my-zsh"
dest-dir = "~/.oh-my-zsh/custom"

[[actions]]
type = "symlink-dir"
id = "omz-plugins"
group = "oh-my-zsh"
source-dir = "oh-my-zsh-plugins"
dest-dir = "~/.oh-my-zsh/custom/plugins"

# install_bundles, over the same list file it always read. Everything under
# custom/ is covered by oh-my-zsh's own .gitignore, so neither these clones
# nor the symlinks above make the oh-my-zsh checkout dirty.

[[actions]]
type = "git-clone-list"
id = "zsh-bundles"
group = "oh-my-zsh"
source = "zsh-bundles.txt"
dest-dir = "~/.oh-my-zsh/custom/plugins"

# --- 20-setup-vim.sh ------------------------------------------------------
# No sha256: the URL names a file on a branch, so pinning a digest would fail
# on every upstream change.

[[actions]]
type = "fetch-file"
id = "pathogen"
group = "vim"
source = "https://raw.githubusercontent.com/tpope/vim-pathogen/master/autoload/pathogen.vim"
dest = "~/.vim/autoload/pathogen.vim"

# One link to the whole directory, matching what install_dotfile did.

[[actions]]
type = "symlink"
id = "vim-after"
group = "vim"
source = "vim/after"
dest = "~/.vim/after"

# BLACKLIST_VIM_MODULES has no equivalent: skipping one entry of a list is an
# address form batfiles has specified but not built. See README.md.

[[actions]]
type = "git-clone-list"
id = "vim-bundles"
group = "vim"
source = "vim/bundles.txt"
dest-dir = "~/.vim/bundle"

# --- 30-setup-dotfiles.sh -------------------------------------------------

[[actions]]
type = "symlink-dir"
id = "rcfiles"
group = "home"
source-dir = "files"
dest-dir = "~"
dot-prefix = true

# --- 40-setup-binfiles.sh -------------------------------------------------
# The mkdir the script does first is what dest-dir already means.

[[actions]]
type = "symlink-dir"
id = "binfiles"
group = "bin"
source-dir = "binfiles"
dest-dir = "~/bin"

# --- 50-setup-confs.sh ----------------------------------------------------
# The script's mkdir calls are all parents of a destination, which every
# action creates on its own.

[[actions]]
type = "symlink"
id = "kitty"
group = "confs"
source = "confs/kitty.conf"
dest = "~/.config/kitty/kitty.conf"

[[actions]]
type = "symlink"
id = "starship"
group = "confs"
source = "confs/starship.toml"
dest = "~/.config/starship.toml"

[[actions]]
type = "symlink"
id = "rofi"
group = "confs"
source = "confs/config.rasi"
dest = "~/.config/rofi/config.rasi"

# confs/mise holds three files and only two of them are linked, so these are
# written out rather than done as one symlink-dir.

[[actions]]
type = "symlink"
id = "mise-default-apps"
group = "confs"
source = "confs/mise/default-apps.toml"
dest = "~/.config/mise/conf.d/default-apps.toml"

[[actions]]
type = "symlink"
id = "mise-default-settings"
group = "confs"
source = "confs/mise/default-settings.toml"
dest = "~/.config/mise/conf.d/default-settings.toml"

# The three templates the script copied behind an `if [[ ! -e ]]` guard. That
# guard is what `copy` means: it seeds where nothing is and keeps what it
# finds.

[[actions]]
type = "copy"
id = "mise-config"
group = "confs"
source = "confs/mise/empty-config.toml"
dest = "~/.config/mise/config.toml"

[[actions]]
type = "copy"
id = "atuin-config"
group = "confs"
source = "confs/atuin.toml"
dest = "~/.config/atuin/config.toml"

[[actions]]
type = "copy"
id = "launch-entries"
group = "confs"
source = "confs/launch-entries.ini"
dest = "~/.config/launch-entries.ini"

# --- 55-nvim.sh -----------------------------------------------------------
# The script's guard against ~/.config/nvim being a whole-directory symlink
# has no equivalent here; batfiles refuses the destination instead. See
# README.md.

[[actions]]
type = "symlink"
id = "nvim-init"
group = "nvim"
source = "nvim/init.lua"
dest = "~/.config/nvim/init.lua"

[[actions]]
type = "symlink-dir"
id = "nvim-config"
group = "nvim"
source-dir = "nvim/lua/config"
dest-dir = "~/.config/nvim/lua/config"

[[actions]]
type = "symlink-dir"
id = "nvim-plugins"
group = "nvim"
source-dir = "nvim/lua/plugins"
dest-dir = "~/.config/nvim/lua/plugins"

# The script wrote this file inline; batfiles seeds it from a checked-in copy.

[[actions]]
type = "copy"
id = "nvim-lazyvim-json"
group = "nvim"
source = "nvim/seed/lazyvim.json"
dest = "~/.config/nvim/lazyvim.json"

# ~/.config/nvim-local is where machine-local nvim files go. Nothing installs
# into it, so it has to be asked for outright.

[[actions]]
type = "create-dir"
id = "nvim-local-config"
group = "nvim"
dest = "~/.config/nvim-local/lua/config"

[[actions]]
type = "create-dir"
id = "nvim-local-plugins"
group = "nvim"
dest = "~/.config/nvim-local/lua/plugins"
